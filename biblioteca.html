<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca | SONORA</title></head>
<body>
<main class="sonora-library" aria-labelledby="libraryTitle">
  <div class="sl-topline"><a href="index.html" data-page="inicio"><i class="bi bi-arrow-left"></i> Volver al inicio</a><span>UNA COLECCIÓN. TU IDENTIDAD.</span></div>
  <header class="sl-intro"><div><p class="sl-eyebrow">MI BIBLIOTECA</p><h1 id="libraryTitle">Tu universo <span>musical.</span></h1><p class="sl-subtitle">Las canciones que te acompañan, en un solo lugar.</p></div><span class="sl-account-label"><i class="bi bi-cloud-check"></i> Tu música, contigo</span></header>
  <div class="sl-toolbar"><div class="sl-tabs" role="tablist" aria-label="Tu colección"><button type="button" role="tab" id="sl-tab-favorites" aria-controls="sl-panel" aria-selected="true" data-library-tab="favorites"><i class="bi bi-heart-fill"></i> Favoritos</button><button type="button" role="tab" id="sl-tab-playlists" aria-controls="sl-panel" aria-selected="false" tabindex="-1" data-library-tab="playlists"><i class="bi bi-music-note-list"></i> Playlists</button><button type="button" role="tab" id="sl-tab-following" aria-controls="sl-panel" aria-selected="false" tabindex="-1" data-library-tab="following"><i class="bi bi-people"></i> Siguiendo</button></div><button type="button" class="sl-button" data-library-create><i class="bi bi-plus-lg"></i> Crear playlist</button></div>
  <p class="sl-status" role="status" aria-live="polite"></p>
  <div id="sl-panel" class="sl-panel" role="tabpanel" aria-labelledby="sl-tab-favorites" tabindex="0"></div>
  <dialog class="sl-dialog sl-editor" aria-labelledby="slEditorTitle"><form class="sl-edit-form"><div class="sl-dialog-heading"><div><p class="sl-eyebrow">TU SELECCIÓN</p><h2 id="slEditorTitle">Crear playlist</h2></div><button type="button" class="sl-icon" data-library-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div><label for="slName">Nombre</label><input id="slName" name="name" maxlength="80" placeholder="El nombre de tu próximo universo" required><label for="slDescription">Descripción <span>(opcional)</span></label><textarea id="slDescription" name="description" maxlength="400" rows="3" placeholder="¿Qué se siente al escucharla?"></textarea><p class="sl-form-note"><i class="bi bi-lock"></i> Una playlist privada, guardada en tu cuenta.</p><p class="sl-form-status" role="status"></p><div class="sl-dialog-actions"><button type="button" class="sl-button sl-secondary" data-library-close>Cancelar</button><button type="submit" class="sl-button">Guardar playlist</button></div></form></dialog>
  <dialog class="sl-dialog sl-picker" aria-labelledby="slPickerTitle"><div class="sl-dialog-heading"><div><p class="sl-eyebrow">EXPLORA TU SONIDO</p><h2 id="slPickerTitle">Añadir canciones</h2></div><button type="button" class="sl-icon" data-library-close aria-label="Cerrar"><i class="bi bi-x-lg"></i></button></div><label class="sl-search"><i class="bi bi-search"></i><input type="search" placeholder="Buscar canción o artista" aria-label="Buscar canciones para la playlist"></label><p class="sl-picker-status" role="status"></p><div class="sl-picker-songs"></div><div class="sl-dialog-actions"><button type="button" class="sl-button" data-library-close>Listo</button></div></dialog>
</main>
<script>location.replace('index.html?page=biblioteca');</script>
</body></html>
